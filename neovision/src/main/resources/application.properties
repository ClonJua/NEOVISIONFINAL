# =============================================================================
# Configuracion base (se versiona y va dentro del jar): SIN secretos.
#
# - Desarrollo local: crea neovision/local.properties (ignorado por git) con
#   la contrasena de tu Postgres, un jwt.secret y, si quieres correo, las
#   credenciales SMTP. Se importa automaticamente (ver spring.config.import).
# - Azure / produccion: todo llega por variables de entorno (SPRING_DATASOURCE_*,
#   JWT_SECRET, SPRING_MAIL_*, SWAGGER_ENABLED, APP_CORS_ALLOWED_ORIGINS,
#   ADMIN_EMAIL / ADMIN_PASSWORD).
# =============================================================================
spring.config.import=optional:file:./local.properties

# Servidor
# Azure App Service (Linux) espera el puerto 8080 por defecto; otras nubes
# (Render, Railway, Heroku-like) inyectan su propio PORT.
server.port=${PORT:8080}

# Documentacion de la API (Swagger UI / OpenAPI)
# Habilitada por defecto para desarrollo. En produccion, SWAGGER_ENABLED=false:
# con esto springdoc ni siquiera registra las rutas, asi que no se expone el
# esquema completo de la API (rutas, parametros, modelos) a cualquiera.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Base de datos
# Defaults para el Postgres local; la contrasena va en local.properties. En
# produccion se sobreescriben con SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/neovision_db
spring.datasource.username=postgres
spring.datasource.password=

# El esquema lo gobiernan las migraciones Flyway (ver abajo); Hibernate solo
# verifica al arrancar que el modelo JPA coincide con la BD.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Migraciones (Flyway) - scripts en src/main/resources/db/migration:
#   V1 estructura (tablas/PK), V2 reconciliacion de columnas, V3 integridad
#   (FK, UNIQUE, CHECK, indices, triggers). Todos idempotentes.
# baseline-version=0 hace que una BD creada antes de Flyway (por ddl-auto=update)
# ejecute igualmente V1..V3 y quede bajo control de versiones.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Esquema previo a Flyway (Hibernate ddl-auto)

# CORS
# Lista separada por comas de los origenes del frontend con permiso de llamar
# a esta API. Cuando el frontend se sirve desde este mismo jar (SpaWebConfig)
# no hace falta; si se despliega aparte, APP_CORS_ALLOWED_ORIGINS con su URL.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT
# Sin default a proposito: JwtService rechaza al arrancar cualquier secreto de
# menos de 32 caracteres, asi que un despliegue sin JWT_SECRET falla de
# inmediato en vez de firmar tokens con una clave conocida. En local, ponlo en
# local.properties.
jwt.secret=${JWT_SECRET:}
# 8 horas. Cerrar sesion ademas revoca el token (TokenBlacklistService), asi
# que este valor es el techo maximo, no la unica defensa.
jwt.expiration=28800000

# Bootstrap (roles + primer administrador)
# Los 4 roles se crean solos si faltan. El admin inicial solo se crea cuando
# no existe ningun usuario ROLE_ADMIN y ADMIN_PASSWORD esta definida; sin
# contrasena configurada no se crea nada (evita un admin con clave conocida).
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@neovision.com}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

# Microsoft (App Registration de Azure AD, misma usada por web y movil). Es un
# identificador publico, no un secreto. Se usa para validar que el access token
# del login institucional fue emitido para esta app.
microsoft.expected-client-id=c441594b-ed0a-490c-abee-138cb21acef1

# Email (SMTP). Credenciales por SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
# (env) o en local.properties. Sin ellas el envio falla de forma controlada
# (ver GlobalExceptionHandler#handleMail) y el resto de la app sigue operando.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from-name=NeoVision
